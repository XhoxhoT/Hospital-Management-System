spring.application.name=hospital-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hospital_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:xhoni}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2002}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=*
springdoc.swagger-ui.path=/swagger-ui-custom.html
springdoc.swagger-ui.operationsSorter=method

jwt.secret=${JWT_SECRET:hospital-management-secret-key-minimum-256-bits-long-enough}
jwt.expiration=86400000

admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}