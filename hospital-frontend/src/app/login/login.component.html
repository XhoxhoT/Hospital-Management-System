<app-navbar></app-navbar>
<div class="login-container">
  <div class="login-card">
    <h2>Hyrje në Menaxhimin e Spitalit</h2>
    <p class="subtitle">Shkruani kredencialet tuaja për të hyrë</p>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <div *ngIf="error" class="alert alert-error">
      {{ error }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Emri i përdoruesit</label>
        <input type="text" id="username" formControlName="username" class="form-control"
          [class.is-invalid]="submitted && f['username'].errors" placeholder="Shkruani emrin e përdoruesit" />
        <div *ngIf="submitted && f['username'].errors" class="invalid-feedback">
          <div *ngIf="f['username'].errors['required']">Emri i përdoruesit është i detyrueshëm</div>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Fjalëkalimi</label>
        <input type="password" id="password" formControlName="password" class="form-control"
          [class.is-invalid]="submitted && f['password'].errors" placeholder="Shkruani fjalëkalimin" />
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <div *ngIf="f['password'].errors['required']">Fjalëkalimi është i detyrueshëm</div>
          <div *ngIf="f['password'].errors['minlength']">Fjalëkalimi duhet të ketë të paktën 6 karaktere</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
        <span *ngIf="loading" class="spinner"></span>
        <span *ngIf="!loading">Hyrje</span>
        <span *ngIf="loading">Duke hyrë...</span>
      </button>
    </form>
  </div>
</div>
<app-footer></app-footer>
