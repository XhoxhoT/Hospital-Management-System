<app-navbar></app-navbar>
<div class="dashboard-container">
  <div class="dashboard-header">
    <div class="header-row">
      <h1>Pavjonet</h1>
      <button class="btn btn-primary" (click)="toggleAddForm()">
        {{ showAddForm ? '✕ Anulo' : '+ Shto Pavjon' }}
      </button>
    </div>

    <div class="search-bar">
      <input type="text" class="form-input search-input" placeholder="Kërko pavjon..." [(ngModel)]="searchQuery" />
    </div>

    <div *ngIf="showAddForm" class="add-form">
      <input type="text" class="form-input" placeholder="Emri i pavjonit..." [(ngModel)]="newDepartmentName"
        (keyup.enter)="submitAddDepartment()" autofocus />
      <button class="btn btn-primary" (click)="submitAddDepartment()"
        [disabled]="addingDepartment || !newDepartmentName.trim()">
        {{ addingDepartment ? 'Duke shtuar...' : 'Shto' }}
      </button>
      <span *ngIf="addError" class="form-error">{{ addError }}</span>
    </div>
  </div>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Duke ngarkuar...</p>
  </div>

  <div *ngIf="error && !loading" class="error-state">
    <p>{{ error }}</p>
  </div>

  <div class="dashboard-content" *ngIf="!loading && !error">
    <div class="pavilions-grid">
      <div *ngIf="filteredPavilions.length === 0" class="no-results">
        No departments match "{{ searchQuery }}"
      </div>

      <div class="pavilion-card" *ngFor="let pavilion of filteredPavilions" (click)="navigateToPavilion(pavilion)">
        <div class="pavilion-arrow">→</div>
        <div class="pavilion-info">
          <h3 class="pavilion-title">{{ pavilion.name }}</h3>
          <div class="pavilion-beds">
            <span class="beds-available">{{ pavilion.freeBeds }}</span>
            <span class="beds-separator">/</span>
            <span class="beds-total">{{ pavilion.totalBeds }}</span>
            <span class="beds-label">beds free</span>
          </div>
          <div class="capacity-bar-wrapper">
            <div class="capacity-bar">
              <div class="capacity-segment seg-occupied" [style.width.%]="getOccupiedPercent(pavilion)"></div>
              <div class="capacity-segment seg-free" [style.width.%]="getFreePercent(pavilion)"></div>
            </div>
            <div class="capacity-labels">
              <span class="lbl-occupied">{{ getOccupiedCount(pavilion) }} occupied</span>
              <span class="lbl-free">{{ pavilion.freeBeds }} free</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
